name: render-full

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 libpango-1.0-0 libcairo2

      - name: Render komposisi Full
        run: npx remotion render src/index.ts Full out/simulasi-medsos.mp4 --codec h264

      - name: Unggah artefak video
        uses: actions/upload-artifact@v4
        with:
          name: simulasi-medsos-video
          path: out/simulasi-medsos.mp4
          retention-days: 7
